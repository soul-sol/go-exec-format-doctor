name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - run: go test -race -shuffle=on -count=1 ./...
      - name: Build release archives
        run: |
          set -eu
          mkdir -p dist
          for target in \
            darwin/amd64 darwin/arm64 \
            linux/386 linux/amd64 linux/arm64 \
            windows/amd64 windows/arm64
          do
            os=${target%/*}
            arch=${target#*/}
            name=go-exec-format-doctor_${GITHUB_REF_NAME}_${os}_${arch}
            suffix=
            if [ "$os" = windows ]; then suffix=.exe; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w" \
              -o "dist/go-exec-format-doctor${suffix}" \
              ./cmd/go-exec-format-doctor
            tar -C dist -czf "dist/${name}.tar.gz" "go-exec-format-doctor${suffix}"
            rm "dist/go-exec-format-doctor${suffix}"
          done
          cd dist
          sha256sum *.tar.gz > checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
